# Static Vespid package repository.
#
# HAProxy terminates TLS on 443 and proxies to this vhost on 127.0.0.1:8091.
# The Listen directive is already provided by /etc/httpd/conf.d/driftkeep-repo.conf.

<VirtualHost *:8091>
    ServerName packages.vespid.app
    DocumentRoot /srv/driftkeep-repo/repos/vespid/public

    <Directory "/srv/driftkeep-repo/repos/vespid/public">
        # Match the driftkeep repo policy: no directory listings, no CGI or
        # server-side includes.
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Keep package types explicit even if the distro mime.types changes.
    AddType application/x-rpm .rpm
    AddType application/vnd.debian.binary-package .deb

    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=300"
        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>
    </IfModule>

    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>

    ErrorLog  /var/log/httpd/vespid-repo_error.log
    CustomLog /var/log/httpd/vespid-repo_access.log combined

    <IfModule mod_security2.c>
        SecRequestBodyAccess Off
        SecResponseBodyAccess Off
        SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" \
            "id:9100030,phase:1,deny,status:405,log,msg:'vespid repo: method not allowed'"
        SecRule REQUEST_HEADERS:Content-Length "@gt 0" \
            "id:9100031,phase:1,deny,status:413,log,msg:'vespid repo: request body not allowed'"
        SecRule REQUEST_HEADERS:Transfer-Encoding "!@rx ^$" \
            "id:9100032,phase:1,deny,status:413,log,msg:'vespid repo: transfer encoding not allowed'"
    </IfModule>
</VirtualHost>
