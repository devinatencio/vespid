# HTTP endpoint for packages.vespid.app.
#
# Port 80 answers ACME HTTP-01 challenges from /var/www/acme and redirects
# everything else to the TLS listener on 443 (HAProxy).

<VirtualHost *:80>
    ServerName packages.vespid.app

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory "/var/www/acme/.well-known/acme-challenge">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  /var/log/httpd/vespid-packages-http_error.log
    CustomLog /var/log/httpd/vespid-packages-http_access.log combined

    <IfModule mod_security2.c>
        SecRequestBodyAccess Off
        SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" \
            "id:9100040,phase:1,deny,status:405,log,msg:'vespid packages: method not allowed'"
    </IfModule>
</VirtualHost>
