[workspace]
resolver = "2"
members = [
    "crates/vespid-agent",
    "crates/vespid-agent-common",
    "crates/vespid-agent-enroll",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/vespid/hivemonitor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "cookies"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
snap = "1"
bytes = "1"
libc = "0.2"
hostname = "0.4"
tokio-util = "0.7"
async-trait = "0.1"
regex = "1"
sd-notify = "0.3"
url = "2"
prost = "0.13"
prost-build = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
