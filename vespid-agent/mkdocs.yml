site_name: Vespid Agent
site_description: Lightweight Linux monitoring agent with centralized fleet dashboards
site_url: https://vespid.io
repo_url: https://github.com/vespid/hivemonitor
edit_uri: edit/main/docs/
site_dir: website/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Agent:
      - Getting Started: agent/getting-started.md
      - Configuration: agent/configuration.md
      - Collectors: agent/collectors.md
      - Synthetic Monitoring: agent/synthetic-monitoring.md
  - Server Integration: server/integration.md
  - Dashboard: dashboard/guide.md
