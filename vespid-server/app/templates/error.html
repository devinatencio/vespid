{% extends "base.html" %}
{% block title %}{{ title }} — Vespid Server{% endblock %}
{% block content %}
<div style="max-width:480px; margin:4rem auto; text-align:center; padding:2rem;">
    <h1 style="font-size:4rem; margin-bottom:0.5rem; color:var(--warning);">429</h1>
    <h2 style="font-size:1.25rem; color:var(--text-heading); margin-bottom:1rem;">{{ title }}</h2>
    <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.5;">{{ message }}</p>
    <p style="margin-top:1.5rem;">
        <a href="/" style="color:var(--accent); text-decoration:none; font-weight:500;">Return to Dashboard</a>
    </p>
</div>
{% endblock %}
