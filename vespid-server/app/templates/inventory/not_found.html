{% extends "base.html" %}
{% block title %}Asset Not Found{% endblock %}
{% block content %}
<div class="page-container">
    <div class="content-card">
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Asset Not Found</h3>
            <p>No asset with ID <code>{{ asset_id }}</code> exists in the inventory.</p>
            <a href="{{ url_for('inventory.overview') }}" class="btn btn-primary" style="margin-top:1rem;display:inline-block;">&larr; Inventory Overview</a>
        </div>
    </div>
</div>
{% endblock %}
