pack_name: sigma-host-threats
display_name: Sigma Host Threat Detection (Auditd)
icon: 🐧
description: >
  Host-based process creation detection rules imported from SigmaHQ/sigma. Covers reverse shells, privilege escalation, persistence, defense evasion, credential dumping, lateral movement, C2, and exfiltration via Linux auditd process monitoring. Auto-generated from the Sigma community rule repository.
prerequisite: Requires auditd configured with execve audit rules.
rules:
  - name: sigma_shell_invocation_via_apt_-_linux
    event_type: SIGMA_HOST_DETECTION
    regex: >-
      (?=.*(?:exe=.*/apt(?:\x1e|$)|exe=.*/apt-get(?:\x1e|$)))(?=.*cmdline=.*APT::Update::Pre-Invoke::=)
    log_sources: ["auditd"]
    max_attempts: 1
    window_seconds: 1
    tags: ["attack.discovery", "attack.t1083"]
    sigma_id: bb382fd5-b454-47ea-a264-1828e4c766d6
    sigma_status: test
  - name: sigma_scheduled_taskjob_at
    event_type: SIGMA_HOST_DETECTION
    regex: >-
      (?:exe=.*/at(?:\x1e|$)|exe=.*/atd(?:\x1e|$))
    log_sources: ["auditd"]
    max_attempts: 1
    window_seconds: 1
    tags: ["attack.privilege-escalation", "attack.execution", "attack.persistence", "attack.t1053.002"]
    sigma_id: d2d642d7-b393-43fe-bae4-e81ed5915c4b
    sigma_status: stable
