pack_name: sigma-web-attacks
display_name: Sigma Web Attack Detection
icon: 🌐
description: >
  Web application attack detection rules imported from SigmaHQ/sigma. Covers SQL injection, XSS, path traversal, JNDI/Log4Shell exploits, SSTI, webshells, suspicious user agents, scanner tools, and source code enumeration. Auto-generated from the Sigma community rule repository.
prerequisite: Requires web server access logs in Combined Log Format (Apache/Nginx).
rules:
  - name: sigma_apache_segmentation_fault
    event_type: SIGMA_DETECTION
    regex: >-
      (?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]*\]\s+"\S+\s+[^"]*?(?:exit signal Segmentation Fault)[^"]*?"\s+\d+\s+\S+\s+"[^"]*"\s+"[^"]*"
    log_sources: ["apache"]
    max_attempts: 2
    window_seconds: 120
    tags: ["attack.impact", "attack.t1499.004"]
    sigma_id: 1da8ce0b-855d-4004-8860-7d64d42063b1
    sigma_status: test
  - name: sigma_apache_threading_error
    event_type: SIGMA_DETECTION
    regex: >-
      (?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]*\]\s+"\S+\s+[^"]*?(?:__pthread_tpp_change_priority: Assertion `new_prio == -1 \|\| \(new_prio >= fifo_min_prio && new_prio <= fifo_max_prio\))[^"]*?"\s+\d+\s+\S+\s+"[^"]*"\s+"[^"]*"
    log_sources: ["apache"]
    max_attempts: 3
    window_seconds: 300
    tags: ["attack.initial-access", "attack.lateral-movement", "attack.t1190", "attack.t1210"]
    sigma_id: e9a2b582-3f6a-48ac-b4a1-6849cdc50b3c
